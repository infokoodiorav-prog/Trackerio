<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="progress.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EasyGym</title>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div class="logo">
          <img src="logo.jpg" alt="Logo" />
        </div>
        <button
          class="burger"
          id="burgerBtn"
          aria-expanded="false"
          aria-controls="navMenu"
        >
          <div class="line"></div>
          <div class="line"></div>
          <div class="line"></div>
        </button>

        <nav class="nav-menu hidden" id="navMenu" aria-label="Main navigation">
          <a href="index.html">Treening</a>
          <a href="meal-diary.html">Toitumine</a>
          <a href="progress.html">Statistika</a>
          <a href="tips.html">Kasulik info</a>
          <a href="contact.html">Kontakt</a>
        </nav>
      </div>
      <hr class="hr" />
      <div id="workoutStats"></div>
      <div id="topExercises"></div>

      <div class="exercise-controls">
        <div class="exercise-top-row">
          <button id="showAllExercises">Vaata kõiki harjutusi</button>

          <span id="totalExercises"></span>
        </div>

        <div class="search-box hidden">
          <i data-lucide="search"></i>

          <input
            id="exerciseSearch"
            type="text"
            placeholder="Otsi harjutust..."
          />

          <button id="clearSearch" class="clear-search hidden">
            <i data-lucide="x"></i>
          </button>
        </div>
      </div>

      <div id="allExercises" class="hidden"></div>
    </div>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="helpers.js"></script>
    <script src="date.js"></script>
    <script src="storage.js"></script>
    <script src="progress.js"></script>
  </body>
</html>
